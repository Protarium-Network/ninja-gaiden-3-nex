services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ng3
      POSTGRES_USER: ng3
      POSTGRES_PASSWORD: ng3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ng3 -d ng3"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ng3-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_NG3_AUTH_PORT: "28800"
      PN_NG3_SECURE_PORT: "28801"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_NG3_SECURE_HOST: ${PN_NG3_SECURE_HOST:-localhost}
      PN_NG3_POSTGRES_URI: postgres://ng3:ng3@postgres:5432/ng3?sslmode=disable
      PN_NG3_KERBEROS_PASSWORD: ${PN_NG3_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_NG3_LOCAL_MODE=0
      # and providing the two NEX_* secrets (matching your account server).
      PN_NG3_LOCAL_MODE: ${PN_NG3_LOCAL_MODE:-1}
      PN_NG3_LEGACY_SIGNATURE: ${PN_NG3_LEGACY_SIGNATURE:-}
      PN_NG3_SETTINGS_PATH: /home/go/app/settings.json
      PN_NG3_NEX_TOKEN_AES_KEY: ${PN_NG3_NEX_TOKEN_AES_KEY:-}
      PN_NG3_NEX_PASSWORD_SECRET: ${PN_NG3_NEX_PASSWORD_SECRET:-}
      # Optional S3 for DataStore object uploads (downloads work without it).
      PN_S3_ENDPOINT: ${PN_S3_ENDPOINT:-}
      PN_S3_ACCESS_KEY: ${PN_S3_ACCESS_KEY:-}
      PN_S3_SECRET_KEY: ${PN_S3_SECRET_KEY:-}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-ng3-datastore}
    ports:
      - "28800:28800/udp"
      - "28801:28801/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  ng3-postgres:
